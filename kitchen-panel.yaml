# ============================================================
#  kitchen-panel.yaml
#  reTerminal E1002 — Kitchen Dashboard
#  ESPHome · ESP-IDF · 3-screen ePaper panel
#
#  Screen 1: Main dashboard (weather, solar, battery, status)
#  Screen 2: Climate (room temps, heat pump, calling status)
#  Screen 3: Secondary (presence, motion, media, transport)
#
#  Buttons:  Left=prev screen  Right=next screen  Mid=config
#  Deep sleep: 30 min between refreshes (disabled in config mode)
# ============================================================

esphome:
  name: kitchen-panel
  friendly_name: Kitchen Panel
  includes:
    - config_server.h
  libraries:
    - ArduinoJson
  on_boot:
    priority: 600
    then:
      # Enable battery measurement circuit (GPIO21 must be HIGH first)
      - output.turn_on: bsp_battery_enable
      # Enable SD card power rail
      - output.turn_on: bsp_sd_enable
      - delay: 300ms
      # Load all config from NVS into globals
      - lambda: 'load_config_from_nvs();'
      # Initial sensor readings
      - component.update: battery_voltage
      - component.update: battery_level
      - component.update: internal_temp_sensor
      # Brief LED flash to confirm boot (matches Seeed wiki pattern)
      - light.turn_on: onboard_led
      - delay: 200ms
      - light.turn_off: onboard_led
      # Register config API on web server
      - lambda: |-
          extern httpd_handle_t httpd_handle;
          register_config_api(httpd_handle);
      # Draw screen 1 on boot
      - display.page.show: page1
      - component.update: epaper_display

# -- TIME (required for footer timestamps and config timeout) -
time:
  - platform: homeassistant
    id: esptime

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 32MB

psram:
  mode: octal
  speed: 80MHz

# -- HTTP REQUEST (HA REST API polling for multi-entity alerts) -
http_request:
  useragent: kitchen-panel/1.0
  timeout: 5s

# -- LOGGING -------------------------------------------------
logger:
  level: INFO

# -- HOME ASSISTANT API --------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - logger.log: "HA connected"
  on_client_disconnected:
    - logger.log: "HA disconnected"

# -- OTA -----------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

# -- WIFI ----------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IP assigned by DNS/DHCP server — no static config needed
  ap:
    ssid: "kitchen-panel-setup"
    password: !secret ap_password

captive_portal:

# -- WEB SERVER (config mode) ---------------------------------
# Always running but config mode activates the full UI page
web_server:
  port: 80
  version: 3
  include_internal: true

# -- SPI BUS (ePaper display) --------------------------------
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8   # Used by SD card on same bus

# -- I2C BUS (SHT40 temp/humidity sensor) --------------------
i2c:
  scl: GPIO20
  sda: GPIO19
  scan: true

# -- DEEP SLEEP ----------------------------------------------
deep_sleep:
  id: deep_sleep_ctrl
  run_duration: 90s          # Active window: connect, update, draw, sleep
  sleep_duration: 28min30s   # = 30 min total cycle
  wakeup_pin: GPIO4           # Right white button wakes device
  wakeup_pin_mode: INVERT_WAKEUP

# -- GLOBALS -------------------------------------------------
globals:
  # Current screen (0=page1, 1=page2, 2=page3/config)
  - id: current_page
    type: int
    restore_value: true
    initial_value: '0'

  # Config mode active flag
  - id: config_mode_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Config mode timeout counter (seconds since last activity)
  - id: config_idle_seconds
    type: int
    restore_value: false
    initial_value: '0'

  # Config timeout setting (seconds, default 600 = 10 min)
  - id: config_timeout_seconds
    type: int
    restore_value: true
    initial_value: '600'

  # Battery critical threshold (%, default 10)
  - id: battery_critical_pct
    type: int
    restore_value: true
    initial_value: '10'

  # Battery low threshold (%, default 20)
  - id: battery_low_pct
    type: int
    restore_value: true
    initial_value: '20'

  # Transport urgent threshold (minutes, default 5)
  - id: transport_urgent_mins
    type: int
    restore_value: true
    initial_value: '5'

  # Motion recent threshold (minutes, default 30)
  - id: motion_recent_mins
    type: int
    restore_value: true
    initial_value: '30'

  # Middle button hold timer (milliseconds)
  - id: btn_middle_hold_ms
    type: int
    restore_value: false
    initial_value: '0'

  # Long press threshold (ms) — 800ms feels natural
  - id: btn_middle_long_ms
    type: int
    restore_value: true
    initial_value: '800'
  - id: solar_peak_expected
    type: float
    restore_value: true
    initial_value: '52.0'

  # Climate tolerance (degrees, default 1)
  - id: climate_tolerance
    type: int
    restore_value: true
    initial_value: '1'

  # Force refresh flag -- set by HTTP handler, polled by interval
  - id: force_refresh_flag
    type: bool
    restore_value: false
    initial_value: 'false'

