# -- SCRIPTS -------------------------------------------------
script:
  # Middle button press timer — increments every 50ms while held
  - id: btn_middle_timer_start
    then:
      - lambda: 'id(btn_middle_hold_ms) = 0;'
      - while:
          condition:
            binary_sensor.is_on: btn_middle
          then:
            - delay: 50ms
            - lambda: 'id(btn_middle_hold_ms) += 50;'

  # Middle button release — decide short vs long press
  - id: btn_middle_timer_stop
    then:
      - lambda: |-
          if (id(btn_middle_hold_ms) >= id(btn_middle_long_ms)) {
            // Long press — toggle config mode
            if (id(config_mode_active)) {
              id(config_mode_active) = false;
              id(config_idle_seconds) = 0;
              id(current_page) = 0;
            } else {
              id(config_mode_active) = true;
              id(config_idle_seconds) = 0;
              id(current_page) = 2;
            }
          }
          // Short press always triggers refresh regardless
          // (config mode entry also redraws via show_current_page)
      - if:
          condition:
            lambda: 'return id(btn_middle_hold_ms) < id(btn_middle_long_ms);'
          then:
            # Short press — force refresh current page
            - component.update: battery_level
            - component.update: internal_temp_sensor
            - script.execute: show_current_page
          else:
            # Long press — show new page (config or page 1)
            - script.execute: show_current_page

  # Show whichever page is current, handle sleep suppression
  - id: show_current_page
    then:
      - lambda: |-
          // -- Low battery guard -----------------------------------
          // Don't refresh if battery critically low — voltage sag
          // mid-refresh can permanently damage Spectra 6 pixels.
          // Display lambda will show red battery icon in footer.
          float bat = id(battery_level).state;
          if (bat < 5.0f) {
            ESP_LOGW("display", "Battery too low (%.0f%%) — skipping refresh", bat);
            return;
          }

          // -- Temperature guard -----------------------------------
          // Spectra 6 operating range: 0°C–50°C.
          // Display lambda will show red thermometer in footer
          // when temp is outside safe range.
          float temp = id(internal_temp_sensor).state;
          float temp_min = (float)id(display_temp_min_c);
          if (temp < temp_min || temp > 50.0f) {
            ESP_LOGW("display", "Temp out of range (%.1f°C) — skipping refresh", temp);
            // Still show page — lambda draws the warning indicator
            // but skips the actual display update
          }

          // -- Refresh cooldown ------------------------------------
          // Minimum 60s between refreshes to protect display longevity
          int now_s = (int)(millis() / 1000);
          if ((now_s - id(last_refresh_time_s)) < 60 && id(last_refresh_time_s) > 0) {
            ESP_LOGD("display", "Cooldown active — skipping refresh");
            return;
          }
          id(last_refresh_time_s) = now_s;

          // -- Poll entity states from HA REST API -------------
          // Fetches all configured alert slot entities in one pass
          poll_alert_states();

          // -- Show page -------------------------------------------
          switch (id(current_page)) {
            case 0: id(epaper_display).show_page(id(page1)); break;
            case 1: id(epaper_display).show_page(id(page2)); break;
            case 2: id(epaper_display).show_page(id(page3)); break;
          }
      - component.update: epaper_display
      - lambda: |-
          // Suppress deep sleep if on config page
          if (id(current_page) == 2) {
            id(deep_sleep_ctrl).prevent_deep_sleep();
          }

  # Config mode idle watchdog — called every 60s by interval
  - id: check_config_timeout
    then:
      - lambda: |-
          if (!id(config_mode_active)) return;
          id(config_idle_seconds) += 60;
          if (id(config_idle_seconds) >= id(config_timeout_seconds)) {
            // Timeout — exit config mode, return to page 1
            id(config_mode_active) = false;
            id(config_idle_seconds) = 0;
            id(current_page) = 0;
            id(show_current_page).execute();
          }

  # Reset config idle timer (called by web server activity)
  - id: reset_config_timer
    then:
      - lambda: |-
          id(config_idle_seconds) = 0;

# -- INTERVALS ------------------------------------------------
interval:
  # Force refresh flag poll -- set by HTTP API handler
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(force_refresh_flag);'
          then:
            - lambda: 'id(force_refresh_flag) = false;'
            - component.update: battery_level
            - script.execute: show_current_page

  # Config mode timeout watchdog
  - interval: 60s
    then:
      - script.execute: check_config_timeout

  # Periodic display refresh when not in deep sleep (config mode)
  - interval: 30min
    then:
      - if:
          condition:
            lambda: 'return !id(config_mode_active);'
          then:
            - component.update: battery_level
            - component.update: epaper_display

  # 12-hour forced refresh safety net
  # Protects against burn-in if deep sleep cycle stalls
  # Bypasses normal cooldown — always fires
  - interval: 12h
    then:
      - lambda: 'id(last_refresh_time_s) = 0;'  # reset cooldown
      - component.update: battery_level
      - component.update: internal_temp_sensor
      - script.execute: show_current_page
      - logger.log: "12h safety refresh triggered"
