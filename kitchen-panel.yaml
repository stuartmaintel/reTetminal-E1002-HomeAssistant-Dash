  # -- ALERT SLOT ENTITY NAMES (for display) -------------------
  # Friendly names for each entity — shown in detail area.
  # 9 slots x 8 names = 72 string globals.
  # Populated from NVS by load_config_from_nvs().
  # One slot per icon bar item (9 total).
  # Each slot has:
  #   alert_label_N   -- display text e.g. "Front door open"
  #   alert_cond_N    -- condition: "eq"/"ne"/"gt"/"lt"/"contains"
  #   alert_value_N   -- value to compare against e.g. "on"/"armed_away"/"50"
  #   alert_enabled_N -- 1=enabled 0=suppressed
  # Condition operators:
  #   eq       = state == value  (e.g. "on", "armed_away", "due")
  #   ne       = state != value  (e.g. ne "disarmed" = any armed state)
  #   gt       = state as float > value as float
  #   lt       = state as float < value as float
  #   contains = value is substring of state

  # Slot 1 — Alarm
  - id: alert_label_1
    type: std::string
    restore_value: true
    initial_value: '"Alarm armed"'
  - id: alert_cond_1
    type: std::string
    restore_value: true
    initial_value: '"ne"'
  - id: alert_value_1
