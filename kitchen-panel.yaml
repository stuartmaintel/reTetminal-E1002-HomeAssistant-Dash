# -- DISPLAY -------------------------------------------------
# Pin mapping confirmed from Seeed Studio wiki advanced cookbook
# and community ESPHome configs for E1002.
# ⚠️  SCREEN LIFE: Do not display static content for >1 day.
#     Refresh at least once per day. Avoid rapid repeated refreshes.
#     Long-press green button 5s in factory firmware to clear screen.
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    cs_pin: GPIO10       # Chip select
    dc_pin: GPIO11       # Data/command
    busy_pin: GPIO48     # Busy signal from display
    reset_pin: GPIO14    # Hardware reset
    update_interval: never   # Manual updates only (deep sleep cycle)
    pages:
      - id: page1
        lambda: |-
          #include "display_lambda.h"
          draw_page1(it);
      - id: page2
        lambda: |-
          #include "display_lambda.h"
          draw_page2(it);
      - id: page3
        lambda: |-
          #include "display_lambda.h"
          draw_page3(it);

# -- HARDWARE OUTPUTS ----------------------------------------
output:
  # Battery measurement enable (must be HIGH to read ADC)
  # Confirmed: GPIO21 from Seeed wiki
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  # SD card power rail enable
  # Confirmed: GPIO47 from Seeed wiki advanced YAML
  - platform: gpio
    pin: GPIO47
    id: bsp_sd_enable

  # Buzzer PWM — GPIO45, LEDC peripheral
  # Confirmed: GPIO45 from Seeed wiki
  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

# -- ONBOARD LED ---------------------------------------------
# GPIO6, inverted=true (confirmed from Seeed wiki)
output:
  - platform: gpio
    pin:
      number: GPIO6
      inverted: true
    id: led_output

light:
  # LED exposed to HA — useful for alerts/notifications
  - platform: binary
    name: "Onboard LED"
    id: onboard_led
    output: led_output

  # Buzzer as monochromatic light — brightness = duty cycle = volume
  # This matches Seeed's recommended pattern exactly
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer_light
    default_transition_length: 0s

# -- BUTTONS -------------------------------------------------
# GPIO mapping confirmed from Seeed wiki advanced cookbook:
#   GPIO3 = Green button (centre)
#   GPIO4 = Right white button  ← also deep sleep wakeup pin
#   GPIO5 = Left white button
binary_sensor:
  # Left white button — previous screen
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Left"
    id: btn_left
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - lambda: |-
            id(current_page) = (id(current_page) - 1 + 3) % 3;
        - script.execute: show_current_page

  # Green button — short press = force refresh, long press = config mode
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Middle"
    id: btn_middle
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - script.execute: btn_middle_timer_start
    on_release:
      then:
        - script.execute: btn_middle_timer_stop

  # Right white button — next screen (also deep sleep wakeup)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Right"
    id: btn_right
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - lambda: |-
            id(current_page) = (id(current_page) + 1) % 3;
        - script.execute: show_current_page

# -- SENSORS -------------------------------------------------
sensor:
  # -- Device battery --------------------------------------
  - platform: adc
    pin: GPIO1
    name: "Device Battery Voltage"
    id: battery_voltage
    update_interval: 600s
    attenuation: 12db
    filters:
      - multiply: 2.0    # Voltage divider compensation
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: template
    name: "Device Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    # Use calibrate_linear from raw voltage — matches Seeed wiki LiPo curve exactly
    lambda: 'return id(battery_voltage).state;'
    update_interval: 600s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  # -- Internal temperature / humidity (SHT40) --------------
  - platform: sht4x
    temperature:
      name: "Internal Temperature"
      id: internal_temp_sensor
    humidity:
      name: "Internal Humidity"
      id: internal_humidity_sensor
    update_interval: 60s
    address: 0x44

  # -- HA entity subscriptions — Weather --------------------
